<style>
/* Layout: single phone column, sticky month header, content tabs, fixed bottom tab bar + floating add button */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f5f7fb; --ink:#16203a; --muted:#66708a; --line:#dde2ec;
  --head:#1b2742; --head-ink:#ffffff; --head-muted:#aab5cf;
  --g1:#2f5fb3; --g2:#d27c12; --g3:#2a8753;
  --ok:#2a8753; --warn:#d27c12; --bad:#c9352b;
  --ok-bg:#e3f3ea; --warn-bg:#fcefdc; --bad-bg:#fbe5e3; --info-bg:#e5edfb; --soft-bg:#fff7e0; --soft:#a8790a;
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1120; --surface:#151c2f; --surface2:#1b2339; --ink:#e8ecf5; --muted:#94a0bb; --line:#263049;
  --head:#111a2e; --head-ink:#ffffff; --head-muted:#8f9bb8;
  --g1:#6d98ea; --g2:#f0a447; --g3:#4fbf82;
  --ok:#4fbf82; --warn:#f0a447; --bad:#f06b60;
  --ok-bg:#16322a; --warn-bg:#3a2a14; --bad-bg:#3d1c1c; --info-bg:#1a2745; --soft-bg:#332b12; --soft:#e8c35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1120; --surface:#151c2f; --surface2:#1b2339; --ink:#e8ecf5; --muted:#94a0bb; --line:#263049;
  --head:#111a2e; --head-ink:#ffffff; --head-muted:#8f9bb8;
  --g1:#6d98ea; --g2:#f0a447; --g3:#4fbf82;
  --ok:#4fbf82; --warn:#f0a447; --bad:#f06b60;
  --ok-bg:#16322a; --warn-bg:#3a2a14; --bad-bg:#3d1c1c; --info-bg:#1a2745; --soft-bg:#332b12; --soft:#e8c35a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
.app{max-width:540px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink);padding:14px 16px 12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mbtn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--head-ink);font-size:20px;line-height:1;display:grid;place-items:center}
.mlabel{text-align:center;min-width:0}
.mlabel .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--head-muted)}
.mlabel h1{margin:2px 0 0;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.01em}

main{padding:16px;display:flex;flex-direction:column;gap:16px}
.banner{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px}
.card{background:var(--surface);border-radius:18px;padding:16px;border:1px solid var(--line)}
.sec-title{font-family:var(--display);font-weight:600;font-size:17px;margin:0 0 10px;text-wrap:balance}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* hero */
.hero{background:var(--surface);border-radius:22px;padding:18px 18px 16px;border:1px solid var(--line)}
.hero .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.05;margin:4px 0 2px;letter-spacing:-.01em}
.hero .sub{color:var(--muted);font-size:13px}
.meter{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:14px 0 6px;display:flex}
.meter i{display:block;height:100%}
.meter-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:20px;margin-top:2px}
.kpi small{color:var(--muted);font-size:12px}

/* donut */
.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.donut{width:150px;height:150px}
.donut text{fill:var(--ink)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend span:last-child{color:var(--muted)}
@media (max-width:360px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}

/* categories */
.group{border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.ghead{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;border-left:5px solid var(--gc)}
.ghead h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gc)}
.ghead .num{font-size:13px;color:var(--muted)}
.crow{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.crow-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.crow-name{font-weight:600}
.crow-amt{font-size:13px;color:var(--muted);white-space:nowrap}
.crow-amt b{color:var(--ink)}
.bar{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.crow-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.none{color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right}
tr:last-child td{border-bottom:0}
.pos{color:var(--bad);font-weight:700}.neg{color:var(--ok);font-weight:700}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.kv:last-child{border-bottom:0}
.kv b{white-space:nowrap}
.kv.total{font-weight:700;font-size:15px}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}

/* transactions */
.tx-head{display:flex;justify-content:space-between;align-items:baseline}
.day{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 4px 6px}
.txlist{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.tx:first-child{border-top:0}
.tx .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--gc);flex:none}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-weight:600}
.tx .mid span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-weight:700;white-space:nowrap}
.copybox{display:flex;flex-direction:column}
.copyarea{margin-top:8px;width:100%;min-height:90px;font:12px/1.4 ui-monospace,monospace;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* plan form */
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:600;min-width:0}
.field label small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.money{display:flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:0 10px;width:132px;flex:none}
.money input{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;text-align:right;padding:9px 0;font-variant-numeric:tabular-nums}
.money input:focus{outline:none}
.money:focus-within{border-color:var(--g1)}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;width:100%}
.btn.primary{background:var(--head);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--g1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--g1)}}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}

/* tab bar + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center}
.mbtn.off{visibility:hidden}
.tab{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.fab{justify-self:center;width:56px;height:56px;border-radius:50%;border:0;background:var(--g1);color:#fff;font-size:30px;line-height:1;margin-top:-26px;box-shadow:0 6px 18px rgba(20,40,90,.3)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:540px;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--display);font-size:20px;margin:0 0 12px}
.amt-in{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:8px 0 14px}
.amt-in input{font-family:var(--display);font-weight:800;font-size:44px;width:100%;max-width:260px;text-align:right;border:0;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums}
.amt-in input:focus{outline:none}
.amt-in span{font-family:var(--display);font-weight:800;font-size:30px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:#fff}
.inrow{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.inrow input{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}
/* accounts */
.acc-list{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.acc{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.acc:first-child{border-top:0}
.acc .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;background:var(--gc);flex:none}
.acc .mid{flex:1;min-width:0}
.acc .mid b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .mid span{display:block;color:var(--muted);font-size:12.5px}
.acc .amt{font-weight:800;font-family:var(--display);font-size:17px;white-space:nowrap}
.acc.out .amt{color:var(--muted)}
.sub-h{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 8px}
.sub-h h3{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.switch b{display:block;font-weight:600}
.switch small{color:var(--muted);font-size:12px}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
.inrow select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.acc-sum{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.acc-sum span{font-size:12.5px;color:var(--muted)}
.acc-sum b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--g1);font-weight:700;padding:0;font-size:13px}
.subs{margin:4px 0 8px 12px;padding:10px 0 4px 12px;border-left:2px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.subs-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mini-sw{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;cursor:pointer}
.mini-sw input{width:16px;height:16px;accent-color:var(--g1)}
.sublist{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--sc,var(--line));background:var(--sb,var(--surface));text-align:left;transition:background .2s}
.srow .sday{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface2);color:var(--sc,var(--ink));flex:none}
.srow .mid{flex:1;min-width:0}
.srow .mid b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .mid span{display:block;font-size:12px;color:var(--sc,var(--muted));font-weight:600}
.srow .amt{font-weight:700;white-space:nowrap}
.srow.s-now{--sc:var(--bad);--sb:var(--bad-bg)}
.srow.s-3{--sc:var(--warn);--sb:var(--warn-bg)}
.srow.s-7{--sc:var(--soft);--sb:var(--soft-bg)}
.srow.s-14{--sc:var(--g1);--sb:var(--info-bg)}
.srow.s-far{--sc:var(--muted)}
.srow.s-done{--sc:var(--ok);opacity:.75}
.subs-sum{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.subs-sum b{color:var(--ink)}
.okmark{color:var(--ok);font-weight:700}
.subs-tg{background:none;border:0;padding:0;text-align:left;min-width:0;display:flex;flex-direction:column;gap:1px}
.subs-tg .tg-name{font-weight:600;display:flex;align-items:center;gap:6px}
.subs-tg .chev{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:15px;transition:transform .15s}
.subs-tg[aria-expanded="true"] .chev{transform:rotate(90deg)}
.subs-tg small{font-size:12px;color:var(--sc,var(--muted));font-weight:600}
.subs-tg.s-now{--sc:var(--bad)}.subs-tg.s-3{--sc:var(--warn)}.subs-tg.s-7{--sc:var(--soft)}.subs-tg.s-14{--sc:var(--g1)}
@media (prefers-reduced-motion: reduce){.subs-tg .chev{transition:none}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn.scan{background:var(--g1);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.scanning{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 8px 10px;text-align:center}
.scanning b{font-size:17px}.scanning span{color:var(--muted);font-size:13px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--g1);animation:sp 0.9s linear infinite;margin-bottom:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
.rv-items{display:flex;flex-direction:column;gap:8px}
.rv-it{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--surface2);display:flex;flex-direction:column;gap:6px}
.rv-top{display:flex;gap:6px;align-items:center}
.rv-name{flex:1;min-width:0;font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px}
.rv-money{width:100px;background:var(--surface)}
.rv-x{border:0;background:none;color:var(--muted);font-size:22px;width:30px;height:30px;flex:none}
.rv-bot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rv-bot select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px;max-width:100%}
.rv-raw{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;overflow-wrap:anywhere}
.rv-sum{border-top:1px solid var(--line);padding-top:6px}
.rv-warn{background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:13px;border-radius:10px;padding:8px 10px;margin:6px 0}
.rv-ok{color:var(--ok);font-weight:700;font-size:13px;margin:6px 0}
.rd-it{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.rd-it:first-child{border-top:0}
.rd-it .mid{flex:1;min-width:0}.rd-it .mid b{display:block;font-weight:600}.rd-it .mid span{font-size:12px;color:var(--muted)}
.rd-it .amt{font-weight:700;white-space:nowrap}
.gbars{display:flex;flex-direction:column;gap:10px}
.gbar-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px;gap:8px}
.muted{color:var(--muted);font-weight:400;font-size:12.5px}
#gsearch{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.qrbox{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.qrbox video{width:100%;height:100%;object-fit:cover;display:block}
.qrframe{position:absolute;inset:18% 22%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.qrmsg{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-weight:600;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
body.nologin .tabs,body.nologin .mbtn{visibility:hidden}
.login input{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}[hidden]{display:none!important}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <button class="mbtn" id="prevM" aria-label="Prethodni mesec">‹</button>
      <div class="mlabel"><div class="eyebrow" id="viewName">Pregled</div><h1 id="monthTitle">—</h1></div>
      <button class="mbtn" id="nextM" aria-label="Sledeći mesec">›</button>
    </div>
  </header>
  <main id="main"><div class="loading">Učitavam budžet…</div></main>
</div>

<nav class="tabs" aria-label="Glavni meni">
  <div class="tabs-in">
    <button class="tab" data-tab="pregled" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/></svg>Pregled</button>
    <button class="tab" data-tab="transakcije">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>Transakcije</button>
    <button class="fab" id="fab" aria-label="Dodaj trošak">+</button>
    <button class="tab" data-tab="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Plan</button>
    <button class="tab" data-tab="racuni">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M7 15h4"/></svg>Računi</button>
  </div>
</nav>
<div id="layer"></div>

<script>
(function(){
const GROUPS=[
  {id:"osnovni",name:"Osnovni troškovi",rule:"Potrebe",rec:.5,color:"--g1",cats:[["hipoteka","Hipoteka"],["racuni","Računi"],["pretplate","Online pretplate"],["hrana","Hrana"]]},
  {id:"licno",name:"Lično",rule:"Želje",rec:.3,color:"--g2",cats:[["cigare","Cigare"],["razno","Razno"]]},
  {id:"invest",name:"Investicije i štednja",rule:"Štednja",rec:.2,color:"--g3",cats:[["etf","ETF"],["zlato","Investiciono zlato"]]}
];
const CATS={};GROUPS.forEach(g=>g.cats.forEach(([id,name],i)=>CATS[id]={id,name,group:g,shade:[1,.78,.58,.42][i]}));
const MONTHS=["januar","februar","mart","april","maj","jun","jul","avgust","septembar","oktobar","novembar","decembar"];
const DAYS=["nedelja","ponedeljak","utorak","sreda","četvrtak","petak","subota"];
const nf=new Intl.NumberFormat("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});
const pf=new Intl.NumberFormat("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});
const eur=v=>nf.format(v||0)+" €";
const pct=v=>isFinite(v)?pf.format((v||0)*100)+"%":"–";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseNum=s=>{s=String(s||"").trim().replace(/\s|€/g,"");if(!s)return NaN;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return Number(s)};
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const mkey=d=>d.slice(0,7);
const shift=(k,n)=>{let[y,m]=k.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+String(m).padStart(2,"0")};
const mTitle=k=>{const[y,m]=k.split("-");return MONTHS[m-1].toUpperCase()+" "+y};

let months={},txs=[],accounts=[],transfers=[],subs=[],cur=mkey(todayISO()),tab="pregled",ready={m:false,t:false,a:false,r:false,s:false,p:false},store=null,localMode=false,readOnly=false,picked=false;
const ATYPES={
  kartica:{name:"Kartica",ic:"KA",inc:true,color:"--g1"},
  tekuci:{name:"Tekući račun",ic:"TR",inc:true,color:"--g1"},
  kes:{name:"Keš",ic:"€",inc:true,color:"--g2"},
  stednja:{name:"Štednja",ic:"ŠT",inc:false,color:"--g3"},
  invest:{name:"Investicije",ic:"IN",inc:false,color:"--g3"},
  ostalo:{name:"Ostalo",ic:"•",inc:true,color:"--muted"}};
const CAM='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function accBal(a){const since=a.setAt||0;let b=+a.opening||0;
  txs.forEach(t=>{if(t.account===a.id&&(t.created||0)>since)b-=+t.amount||0});
  transfers.forEach(r=>{if((r.created||0)<=since)return;if(r.from===a.id)b-=+r.amount||0;if(r.to===a.id)b+=+r.amount||0});
  return Math.round(b*100)/100}
function accSorted(){return accounts.slice().sort((a,b)=>(a.order||0)-(b.order||0)||(a.created||0)-(b.created||0))}
function accTotals(){let inB=0,outB=0;accounts.forEach(a=>{const b=accBal(a);if(a.include)inB+=b;else outB+=b});return{inB,outB,all:inB+outB}}
let lastAcc="";try{lastAcc=localStorage.getItem("budzet-lastacc")||""}catch(e){}

/* ---------- data access ---------- */
function monthData(k){
  if(months[k])return {...months[k],_exists:true};
  const keys=Object.keys(months).sort();
  const prev=keys.filter(x=>x<k).pop(), next=keys.find(x=>x>k), src=prev||next;
  const base=src?months[src]:{income:0,budgets:{}};
  return {income:base.income||0,budgets:{...(base.budgets||{})},carry:null,_exists:false};
}
function calc(k,depth=0){
  const m=monthData(k),inc=+m.income||0;
  const spent={};txs.forEach(t=>{if(t.month===k)spent[t.cat]=(spent[t.cat]||0)+(+t.amount||0)});
  const cats={};let plan=0,spentAll=0;
  Object.values(CATS).forEach(c=>{const b=+(m.budgets||{})[c.id]||0,s=spent[c.id]||0;cats[c.id]={b,s};plan+=b;spentAll+=s});
  Object.keys(spent).forEach(id=>{if(!CATS[id])spentAll+=spent[id]});
  const g={};GROUPS.forEach(G=>{g[G.id]={b:0,s:0};G.cats.forEach(([id])=>{g[G.id].b+=cats[id].b;g[G.id].s+=cats[id].s})});
  const kes=inc-Math.max(plan,spentAll);
  let carry=m.carry;
  if(typeof carry!=="number"){const pk=shift(k,-1);carry=(months[pk]&&depth<24)?calc(pk,depth+1).ukupnoKes:0}
  const ukupnoKes=kes+carry;
  return {m,inc,cats,g,plan,spent:spentAll,kes,carry,autoCarry:typeof m.carry!=="number",ukupnoKes,
    ostaje:inc-spentAll,invRate:inc?g.invest.b/inc:0,pokriva:g.osnovni.b?ukupnoKes/g.osnovni.b:0,
    stednja:inc?(g.invest.b+kes)/inc:0};
}
function status(b,s){if(!s)return["–","none"];const r=b?s/b:Infinity;if(r>1)return["PREKORAČENO","bad"];if(r>=.9)return["BLIZU LIMITA","warn"];return["U REDU","ok"]}

/* ---------- rendering ---------- */
const $=s=>document.querySelector(s);
function render(){
  const accTab=tab==="racuni";
  $("#monthTitle").textContent=accTab?"STANJE DANAS":mTitle(cur);
  $("#viewName").textContent={pregled:"Pregled",transakcije:"Transakcije",plan:"Plan budžeta",racuni:"Moji računi"}[tab];
  $("#prevM").classList.toggle("off",accTab);$("#nextM").classList.toggle("off",accTab);
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  if(!(ready.m&&ready.t&&ready.a&&ready.r&&ready.s&&ready.p)){$("#main").innerHTML='<div class="loading">Učitavam budžet…</div>';return}
  const c=calc(cur);let h="";
  if(localMode)h+='<div class="banner">Podaci se sada čuvaju samo u ovom pregledaču. Otvori aplikaciju prijavljen na claude.ai da bi se čuvali trajno i na svim uređajima.</div>';
  if(readOnly)h+='<div class="banner">Imaš pristup samo za čitanje, pa izmene neće biti sačuvane.</div>';
  h+= tab==="pregled"?viewOverview(c):tab==="transakcije"?viewTx(c):tab==="racuni"?viewAccounts():viewPlan(c);
  $("#main").innerHTML=h;
  if(tab==="plan")bindPlan();
  if(tab==="transakcije"&&$("#copyTx"))$("#copyTx").onclick=copyForSheet;
  if(tab==="transakcije")bindGroceries();
}
function copyForSheet(){
  const list=txs.filter(t=>t.month===cur).sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0));
  const clean=s=>String(s||"").replace(/[\t\r\n]+/g," ");
  const tsv=list.map(t=>{const[y,m,d]=t.date.split("-");const cat=CATS[t.cat]?CATS[t.cat].name.toUpperCase():t.cat;
    return[`${d}.${m}.${y}`,cat,clean(t.desc),String((+t.amount).toFixed(2)).replace(".",",")].join("\t")}).join("\n");
  const fallback=()=>{const ta=$("#copyArea");ta.hidden=false;ta.value=tsv;ta.focus();ta.select();toast("Tekst je označen, kopiraj ga ručno")};
  try{navigator.clipboard.writeText(tsv).then(()=>toast(list.length+" troškova kopirano"),fallback)}catch(e){fallback()}
}
function viewOverview(c){
  const over=c.spent>c.plan&&c.plan>0;
  const spentW=c.inc?Math.min(c.spent/c.inc,1)*100:0, planW=c.inc?Math.max(Math.min(c.plan/c.inc,1)*100-spentW,0):0;
  let h=`<section class="hero"><div class="lbl">Ostaje ovog meseca</div>
  <div class="big num" style="color:${c.ostaje<0?"var(--bad)":"var(--ink)"}">${eur(c.ostaje)}</div>
  <div class="sub num">Prihod ${eur(c.inc)} · potrošeno ${eur(c.spent)}</div>
  <div class="meter" aria-hidden="true"><i style="width:${spentW}%;background:${over?"var(--bad)":"var(--g1)"}"></i><i style="width:${planW}%;background:var(--line)"></i></div>
  <div class="meter-legend num"><span>Potrošeno ${pct(c.plan?c.spent/c.plan:0)} plana</span><span>Plan ${eur(c.plan)}</span></div></section>`;
  if(accounts.length){const T=accTotals();
    h+=`<section class="card"><div class="sub-h" style="margin:0 0 4px"><div class="lbl">Novac na računima u budžetu</div><button class="linkbtn" data-goto="racuni" type="button">Računi ›</button></div>
    <div class="num" style="font-family:var(--display);font-weight:800;font-size:28px;color:${T.inB<0?"var(--bad)":"var(--ink)"}">${eur(T.inB)}</div>
    <div class="acc-sum num"><span>Van budžeta <b>${eur(T.outB)}</b></span><span>Ukupno <b>${eur(T.all)}</b></span></div></section>`}
  const soon=subs.map(x=>({x,u:subDue(x.day)})).filter(o=>o.u.days<=7).sort((a,b)=>a.u.days-b.u.days);
  if(soon.length){h+=`<section class="card"><div class="sub-h" style="margin:0 0 8px"><div class="lbl">Naplata u narednih 7 dana</div><button class="linkbtn" data-goto="plan" type="button">Sve ›</button></div><div class="sublist">`;
    soon.forEach(({x})=>{const st=subState(x);h+=`<button type="button" class="srow ${st.cls}" data-sub="${esc(x.id)}"><span class="sday num">${x.day}.</span><span class="mid"><b>${esc(x.name)}</b><span>${st.txt}</span></span><span class="amt num">${eur(x.amount)}</span></button>`});
    h+=`</div></section>`}
  h+=`<div class="kpis">
   <div class="kpi"><div class="lbl">Planirani rashodi</div><b class="num">${eur(c.plan)}</b><small class="num">višak po planu: ${eur(c.inc-c.plan)}</small></div>
   <div class="kpi"><div class="lbl">Stopa investiranja</div><b class="num">${pct(c.invRate)}</b><small>ETF + zlato / prihodi</small></div></div>`;
  // donut
  let acc=0,seg="",leg="";
  Object.values(CATS).forEach(cat=>{const b=c.cats[cat.id].b;if(!b||!c.plan)return;const p=b/c.plan*100;
    seg+=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="var(${cat.group.color})" stroke-opacity="${cat.shade}" stroke-width="6" stroke-dasharray="${Math.max(p-.5,0)} ${100-Math.max(p-.5,0)}" stroke-dashoffset="${25-acc}"/>`;acc+=p;
    leg+=`<div><span class="dot" style="background:var(${cat.group.color});opacity:${cat.shade}"></span><span>${cat.name}</span><span class="num">${pct(b/c.plan)}</span></div>`});
  h+=`<section class="card"><h2 class="sec-title">Raspodela budžeta</h2>${c.plan?`<div class="donut-wrap">
   <svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Raspodela planiranog budžeta po kategorijama">${seg}
   <text x="21" y="20" text-anchor="middle" font-size="3.2" fill="currentColor" style="fill:var(--muted)">plan</text>
   <text x="21" y="24.6" text-anchor="middle" font-size="4.2" font-weight="800" style="fill:var(--ink)">${nf.format(Math.round(c.plan))}€</text></svg>
   <div class="legend">${leg}</div></div>`:`<p class="note">Unesi iznose u Planu da vidiš raspodelu.</p>`}</section>`;
  // groups
  GROUPS.forEach(G=>{const gg=c.g[G.id];
    h+=`<section class="group" style="--gc:var(${G.color})"><div class="ghead"><h3>${G.name}</h3><span class="num">${eur(gg.s)} / ${eur(gg.b)}</span></div>`;
    G.cats.forEach(([id,name])=>{const {b,s}=c.cats[id];const[st,cls]=status(b,s);const r=b?s/b:(s?1:0);
      const col=cls==="bad"?"var(--bad)":cls==="warn"?"var(--warn)":`var(${G.color})`;
      h+=`<div class="crow"><div class="crow-top"><span class="crow-name">${name}</span><span class="crow-amt num"><b>${eur(s)}</b> / ${eur(b)}</span></div>
       <div class="bar"><i style="width:${Math.min(r,1)*100}%;background:${col}"></i></div>
       <div class="crow-foot num"><span>Preostalo ${eur(b-s)} · ${pct(c.plan?b/c.plan:0)} budžeta</span><span class="pill ${cls}">${st}</span></div></div>`});
    h+=`</section>`});
  // 50/30/20
  h+=`<section class="card"><h2 class="sec-title">Pravilo 50 / 30 / 20</h2><div class="tbl-wrap"><table class="num"><thead><tr><th>Grupa</th><th>Prep.</th><th>Plan</th><th>Potroš.</th><th>Razlika</th></tr></thead><tbody>`;
  GROUPS.forEach(G=>{const p=c.inc?c.g[G.id].b/c.inc:0,d=p-G.rec;const bad=G.id==="invest"?d<0:d>0;
    h+=`<tr><td style="color:var(${G.color});font-weight:700">${G.rule}</td><td>${pct(G.rec)}</td><td>${pct(p)}</td><td>${pct(c.inc?c.g[G.id].s/c.inc:0)}</td><td class="${bad?"pos":"neg"}">${d>0?"+":""}${pct(d)}</td></tr>`});
  h+=`<tr><td style="font-weight:700">Keš</td><td>–</td><td>${pct(c.inc?(c.inc-c.plan)/c.inc:0)}</td><td></td><td></td></tr></tbody></table></div>
  <p class="note">Kod potreba i želja je bolje biti ispod preporuke, kod štednje iznad.</p></section>`;
  // cash
  h+=`<section class="card"><h2 class="sec-title">Keš rezerva</h2>
   <div class="kv"><span>Keš ovog meseca</span><b class="num">${eur(c.kes)}</b></div>
   <div class="kv"><span>Preneto iz prethodnog meseca</span><b class="num">${eur(c.carry)}</b></div>
   <div class="kv total"><span>Ukupno keš</span><b class="num">${eur(c.ukupnoKes)}</b></div>
   <div class="kv"><span>Pokriva osnovne troškove</span><b class="num">${pf.format(c.pokriva)} meseci</b></div>
   <div class="kv"><span>Ukupna štednja (investicije + keš)</span><b class="num">${pct(c.stednja)}</b></div>
   <p class="note">Keš = prihod − veće od (plan, stvarno potrošeno). Ako prekoračiš budžet, keš se smanjuje.</p></section>`;
  return h;
}
function txSeg(){return `<div class="seg" role="tablist"><button type="button" role="tab" data-txv="troskovi" aria-selected="${txView==="troskovi"}">Troškovi</button><button type="button" role="tab" data-txv="namirnice" aria-selected="${txView==="namirnice"}">Namirnice</button></div>`}
function viewTx(c){
  if(txView==="namirnice")return txSeg()+viewGroceries();
  const list=txs.filter(t=>t.month===cur).sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
  let h=txSeg()+`<div class="tx-head"><h2 class="sec-title" style="margin:0">Troškovi</h2><b class="num">${eur(c.spent)}</b></div>`;
  if(scanReady())h+=`<button class="btn scan" type="button" data-scan="1">${CAM}Skeniraj QR kod računa</button>`;
  if(!list.length)return h+`<div class="txlist"><div class="empty"><b>Još nema troškova za ${MONTHS[+cur.slice(5)-1]}</b>Dodaj prvi dugmetom + dole.</div></div>`;
  h+=`<div class="copybox"><button class="btn ghost" id="copyTx" type="button">Kopiraj za Google tabelu (${list.length})</button>
   <p class="note" style="margin:6px 2px 0">U listu TRANSAKCIJE ${MONTHS[+cur.slice(5)-1].toUpperCase()} klikni prvu praznu ćeliju ispod DATUM i nalepi (Ctrl+V).</p>
   <textarea id="copyArea" class="copyarea" readonly hidden aria-label="Troškovi za kopiranje"></textarea></div>`;
  let day="";h+="<div>";
  list.forEach(t=>{if(t.date!==day){if(day)h+="</div>";day=t.date;const d=new Date(t.date+"T12:00");h+=`<div class="day">${DAYS[d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]}</div><div class="txlist">`}
    const cat=CATS[t.cat];const G=cat?cat.group:{color:"--muted"};const ac=accounts.find(a=>a.id===t.account);
    const subl=[t.desc||"Bez opisa",ac?ac.name:""].filter(Boolean).join(" · ");
    h+=`<button class="tx" data-tx="${esc(t.id)}" style="--gc:var(${G.color})"><span class="ic">${esc((cat?cat.name:"?").slice(0,2).toUpperCase())}</span><span class="mid"><b>${esc(cat?cat.name:t.cat)}</b><span>${esc(subl)}</span></span><span class="amt num">−${eur(t.amount)}</span></button>`});
  return h+"</div></div>";
}
function viewPlan(c){
  const m=c.m;
  let h=`<section class="card"><h2 class="sec-title">Prihodi i prenos</h2>
   <div class="field"><label for="p_income">Mesečni prihod</label><span class="money"><input id="p_income" inputmode="decimal" value="${nf.format(m.income||0)}"><span>€</span></span></div>
   <div class="field"><label for="p_carry">Preneto iz prethodnog meseca<small>Prazno = automatski (${eur(c.autoCarry?c.carry:0)})</small></label><span class="money"><input id="p_carry" inputmode="decimal" placeholder="auto" value="${typeof m.carry==="number"?nf.format(m.carry):""}"><span>€</span></span></div></section>`;

const dim=(y,m)=>new Date(y,m+1,0).getDate();
function subDue(day){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
  const thisC=Math.min(day,dim(y,m));
  if(thisC>=d)return{days:thisC-d,charged:false,date:new Date(y,m,thisC)};
  const ny=m===11?y+1:y,nm=(m+1)%12,nextC=Math.min(day,dim(ny,nm));
  return{days:dim(y,m)-d+nextC,charged:true,chargedDay:thisC,date:new Date(ny,nm,nextC)};
}
function subState(s){const u=subDue(s.day),bill=(s.cat||"pretplate")==="racuni";
  if(u.days===0)return{cls:"s-now",txt:bill?"Dospeva danas":"Naplaćuje se danas"};
  if(u.days<=3)return{cls:"s-3",txt:u.days===1?"Sutra":"Za "+u.days+" dana"};
  if(u.days<=7)return{cls:"s-7",txt:"Za "+u.days+" dana"};
  if(u.charged)return{cls:"s-done",txt:(bill?"Dospelo ":"Naplaćeno ")+u.chargedDay+". · sledeći put za "+u.days+" dana"};
  if(u.days<=14)return{cls:"s-14",txt:"Za "+u.days+" dana"};
  return{cls:"s-far",txt:"Za "+u.days+" dana"};
}

    if((type==="Z"||type==="ZLAVA"||price<0&&/zlav|zľav|zlava|zlava|discount|akcia/i.test(name))&&items.length){const last=items[items.length-1];last.price=Math.round((last.price+price)*100)/100;return}

async function fetchReceipt(id){

  catch(e){throw{code:CONFIG.ekasaProxy?"network":"cors"}}

}
function ekErr(e){const c=e&&e.code;

  if(c==="network")return"Nema veze sa eKasa serverom. Proveri internet i adresu Worker-a.";

  if(c==="not_found")return"Doklad nije pronađen u eKasa sistemu. Ako je izdat offline, pojaviće se kasnije; probaj ponovo za par sati.";
  if(c==="offline")return"Ovo je QR kod offline dokladu (bez ID broja). Takav doklad eKasa pronađe tek kad ga kasa pošalje; probaj kasnije ili unesi ID ručno.";

async function startCam(){

  if(!$("#qrv")){stopCam();return}
  v.srcObject=scanStream;await v.play().catch(()=>{});msg.textContent="Uperi kameru u QR kod na računu";
  const cv=$("#qrc");
  scanTimer=setInterval(()=>{if(!v.videoWidth)return;const s=Math.min(1,800/v.videoWidth);cv.width=Math.round(v.videoWidth*s);cv.height=Math.round(v.videoHeight*s);

  else{
    const food=items.filter(it=>subBudget(it.sub)==="hrana").reduce((s,x)=>s+(+x.price||0),0),all=items.reduce((s,x)=>s+(+x.price||0),0);
    h+=`<section class="hero"><div class="lbl">Namirnice ovog meseca</div><div class="big num">${eur(food)}</div><div class="sub num">${rs.length} ${rs.length===1?"račun":rs.length<5?"računa":"računa"} · ${items.length} artikala · sa računa ukupno ${eur(all)}</div></section>`;
    const by={};items.forEach(it=>{by[it.sub]=(by[it.sub]||0)+(+it.price||0)});
    const arr=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=arr[0][1]||1;
    h+=`<section class="card"><h2 class="sec-title">Po vrsti</h2><div class="gbars">${arr.map(([k,v])=>{const bc=subBudget(k),col=bc==="hrana"?"--g1":bc==="cigare"?"--g2":"--muted";
      return`<div class="gbar"><div class="gbar-top"><span>${subName(k)}</span><b class="num">${eur(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%;background:var(${col})"></i></div></div>`}).join("")}</div></section>`;
    const cnt={};items.forEach(it=>{const k=norm(it.name);cnt[k]=cnt[k]||{name:it.name,n:0,sum:0};cnt[k].n+=1;cnt[k].sum+=+it.price||0});
    const top=Object.values(cnt).sort((a,b)=>b.n-a.n||b.sum-a.sum).slice(0,6);
    h+=`<section class="card"><h2 class="sec-title">Najčešće kupuješ</h2>${top.map(t=>`<div class="kv"><span>${esc(t.name)} <span class="muted">× ${t.n}</span></span><b class="num">${eur(t.sum)}</b></div>`).join("")}</section>`;
    h+=`<div><div class="sub-h"><h3>Računi</h3></div><div class="txlist">${rs.map(r=>{const d=new Date(r.date+"T12:00");const t=r.total!=null?r.total:r.items.reduce((s,x)=>s+(+x.price||0),0);
      return`<button class="tx" type="button" data-rcpt="${esc(r.id)}" style="--gc:var(--g1)"><span class="ic">${esc(r.store.slice(0,2).toUpperCase())}</span><span class="mid"><b>${esc(r.store)}</b><span>${d.getDate()}. ${MONTHS[d.getMonth()]} · ${r.items.length} artikala</span></span><span class="amt num">${eur(t)}</span></button>`}).join("")}</div></div>`;
  }
  if(receipts.length)h+=`<section class="card"><h2 class="sec-title">Kada sam kupio…</h2><div class="inrow" style="margin:0"><input id="gsearch" type="search" placeholder="npr. kafa, mleko, piletina" autocomplete="off" aria-label="Pretraga artikala"></div><div id="gres"><p class="note">Pretraga ide kroz sve skenirane račune, u svim mesecima.</p></div></section>`;
  return h;
}
function bindGroceries(){const s=$("#gsearch");if(!s)return;
  s.oninput=()=>{const q=norm(s.value.trim());const out=$("#gres");if(q.length<2){out.innerHTML='<p class="note">Upiši bar 2 slova.</p>';return}
    const hits=[];receipts.forEach(r=>r.items.forEach(it=>{if(norm(it.name).includes(q)||norm(it.raw).includes(q))hits.push({it,r})}));
    hits.sort((a,b)=>b.r.date.localeCompare(a.r.date));
    if(!hits.length){out.innerHTML=`<p class="note">Nema artikla koji sadrži „${esc(s.value.trim())}“.</p>`;return}
    out.innerHTML=`<p class="note" style="margin:8px 0 4px">${hits.length} ${hits.length===1?"kupovina":"kupovina"}</p>`+hits.slice(0,40).map(({it,r})=>{const d=new Date(r.date+"T12:00");
      return`<div class="kv"><span>${esc(it.name)}<br><span class="muted">${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()} · ${esc(r.store)}</span></span><b class="num">${eur(it.price)}</b></div>`}).join("")}}

/* ---------- sheet (add / edit) ---------- */
function openSheet(t){
  const edit=!!t;const firstCat=t?t.cat:"hrana";
  let date=t?t.date:(mkey(todayISO())===cur?todayISO():cur+"-01");
  let sel=firstCat;
  const chips=GROUPS.map(G=>G.cats.map(([id,name])=>`<button type="button" class="chip" data-c="${id}" style="--gc:var(${G.color})" aria-pressed="${id===sel}">${name}</button>`).join("")).join("");
  $("#layer").innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="txForm" role="dialog" aria-label="${edit?"Izmeni trošak":"Novi trošak"}">
   <div class="grab"></div><h2>${edit?"Izmeni trošak":"Novi trošak"}</h2>
   ${!edit&&scanReady()?`<button type="button" class="btn scan" id="f_scan" style="margin-bottom:10px">${CAM}Skeniraj QR kod računa</button>`:""}
   <div class="amt-in"><input id="f_amt" inputmode="decimal" placeholder="0,00" autocomplete="off" value="${t?nf.format(t.amount):""}"><span>€</span></div>
   <div class="lbl" style="margin-bottom:8px">Kategorija</div><div class="chips">${chips}</div>
   <div class="inrow"><label class="lbl" for="f_desc">Opis</label><input id="f_desc" maxlength="80" placeholder="npr. Lidl, struja, Netflix" value="${esc(t?t.desc:"")}"></div>
   <div class="inrow"><label class="lbl" for="f_date">Datum</label><input id="f_date" type="date" value="${date}"></div>
   ${accounts.length?`<div class="inrow"><label class="lbl" for="f_acc">Plaćeno sa</label><select id="f_acc">${accOptions(t?t.account||"":(accounts.some(a=>a.id===lastAcc)?lastAcc:""),true)}</select></div>`:""}
   <div class="err" id="f_err"></div>
   <div class="actions"><button class="btn primary" type="submit">${edit?"Sačuvaj izmene":"Dodaj trošak"}</button>
   ${edit?`<button class="btn danger" type="button" id="f_del">Obriši trošak</button>`:""}
   <button class="btn ghost" type="button" id="f_cancel">Otkaži</button></div></form></div>`;
  const close=()=>$("#layer").innerHTML="";
  $("#scrim").onclick=e=>{if(e.target.id==="scrim")close()};
  $("#f_cancel").onclick=close;
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{sel=b.dataset.c;document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  if($("#f_scan"))$("#f_scan").onclick=()=>{close();pickReceipt()};
  if(!edit)setTimeout(()=>$("#f_amt").focus(),60);
  if(edit){let armed=false;$("#f_del").onclick=async()=>{
    if(!armed){armed=true;$("#f_del").textContent="Dodirni ponovo za brisanje";return}
    try{await store.delTx(t.id);close();toast("Trošak obrisan")}catch(e){$("#f_err").textContent=errMsg(e)}}}
  $("#txForm").onsubmit=async e=>{e.preventDefault();
    const a=parseNum($("#f_amt").value),d=$("#f_date").value;
    if(isNaN(a)||a<=0){$("#f_err").textContent="Unesi iznos veći od nule, npr. 12,50.";return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){$("#f_err").textContent="Izaberi datum.";return}
    const id=t?t.id:("t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    const rec={id,date:d,month:mkey(d),cat:sel,desc:$("#f_desc").value.trim().slice(0,80),amount:Math.round(a*100)/100,created:t?t.created:Date.now(),account:$("#f_acc")?$("#f_acc").value:(t&&t.account)||""};
    if(!t&&rec.account){lastAcc=rec.account;try{localStorage.setItem("budzet-lastacc",lastAcc)}catch(e){}}
    try{await store.setTx(rec);close();toast(edit?"Izmene sačuvane":"Trošak dodat");if(rec.month!==cur){cur=rec.month;picked=true;render()}}
    catch(err){$("#f_err").textContent=errMsg(err)}};
}
function errMsg(e){const c=e&&e.code;
  if(c==="invalid_argument"||c==="permission-denied")return"Nemaš dozvolu da menjaš ove podatke. Proveri Firestore pravila (korak 3 u uputstvu).";
  if(c==="quota_exceeded")return"Prostor za podatke je pun. Obriši stare troškove pa pokušaj ponovo.";
  return"Čuvanje nije uspelo. Proveri internet vezu i pokušaj ponovo."}
let tt;function toast(msg){clearTimeout(tt);let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;tt=setTimeout(()=>el.remove(),1800)}

/* ---------- events ---------- */
$("#prevM").onclick=()=>{cur=shift(cur,-1);picked=true;render()};
$("#nextM").onclick=()=>{cur=shift(cur,1);picked=true;render()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});
$("#fab").onclick=()=>openSheet(null);
$("#main").addEventListener("click",e=>{
  const b=e.target.closest("[data-tx]");if(b){const t=txs.find(x=>x.id===b.dataset.tx);if(!t)return;const r=t.receipt&&receipts.find(x=>x.id===t.receipt);if(r)openReceiptDetail(r);else openSheet(t);return}
  const rc=e.target.closest("[data-rcpt]");if(rc){const r=receipts.find(x=>x.id===rc.dataset.rcpt);if(r)openReceiptDetail(r);return}
  const tv=e.target.closest("[data-txv]");if(tv){txView=tv.dataset.txv;render();return}
  if(e.target.closest("[data-scan]")){pickReceipt();return}
  const ac=e.target.closest("[data-acc]");if(ac){const a=accounts.find(x=>x.id===ac.dataset.acc);if(a)openAccountSheet(a);return}
  const sb=e.target.closest("[data-sub]");if(sb){const x=subs.find(y=>y.id===sb.dataset.sub);if(x)openSubSheet(x);return}
  const tr=e.target.closest("[data-tr]");if(tr){const r=transfers.find(x=>x.id===tr.dataset.tr);if(r)openTransferSheet(r);return}
  const g=e.target.closest("[data-goto]");if(g){tab=g.dataset.goto;render();window.scrollTo(0,0);return}
  if(e.target.closest("#addAcc")){openAccountSheet(null);return}
  if(e.target.closest("#addTr")&&accounts.length>1){openTransferSheet(null)}
});
function pickStart(){if(picked)return;const keys=Object.keys(months).sort();if(keys.length&&!months[cur]&&cur<keys[0])cur=keys[0]}

/* ---------- storage (Firebase) ---------- */
let fbUser=null,unsubs=[];
function fbShim(FB,uid){const base="users/"+uid+"/";const clean=d=>JSON.parse(JSON.stringify(d));
  return{doc:p=>({set:d=>FB.setDoc(FB.doc(FB.db,base+p),clean(d)),delete:()=>FB.deleteDoc(FB.doc(FB.db,base+p))}),
    collection:p=>({onSnapshot:(next,err)=>FB.onSnapshot(FB.collection(FB.db,base+p),s=>next({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)})}}
function showLogin(msg){
  document.body.classList.add("nologin");
  $("#monthTitle").textContent="BUDŽETIRANJE";$("#viewName").textContent="Prijava";
  $("#main").innerHTML=`<section class="card login"><h2 class="sec-title">Prijavi se</h2>
   <form id="loginForm"><div class="inrow"><label class="lbl" for="lg_email">E-mail</label><input id="lg_email" type="email" autocomplete="username" required></div>
   <div class="inrow"><label class="lbl" for="lg_pass">Lozinka</label><input id="lg_pass" type="password" autocomplete="current-password" required></div>
   <div class="err" id="lg_err">${esc(msg||"")}</div><button class="btn primary" type="submit">Prijavi se</button></form>
   <p class="note">Nalog se pravi u Firebase konzoli (Authentication → Users → Add user). Vidi korak 4 u uputstvu.</p></section>`;
  $("#loginForm").onsubmit=async e=>{e.preventDefault();$("#lg_err").textContent="";
    try{await window.__fb.signIn($("#lg_email").value.trim(),$("#lg_pass").value)}
    catch(err){$("#lg_err").textContent=/invalid|wrong|not-found|credential/.test(err.code||"")?"Pogrešan e-mail ili lozinka.":/too-many/.test(err.code||"")?"Previše pokušaja. Sačekaj malo.":"Prijava nije uspela ("+(err.code||"greška")+")."}};
}
function showSetup(){document.body.classList.add("nologin");$("#monthTitle").textContent="BUDŽETIRANJE";$("#viewName").textContent="Podešavanje";
  $("#main").innerHTML=`<section class="card"><h2 class="sec-title">Aplikacija još nije povezana</h2><p>Upiši Firebase podatke u <b>CONFIG</b> na vrhu fajla <b>index.html</b> (korak 3 u uputstvu), pa ponovo otvori stranicu.</p></section>`}
function startData(FB,user){
  fbUser=user;document.body.classList.remove("nologin");
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
  Object.keys(ready).forEach(k=>ready[k]=false);ready.c=false;render();
  const db=fbShim(FB,user.uid);
  store={setMonth:(k,d)=>db.doc("months/"+k).set(d),setTx:r=>db.doc("tx/"+r.id).set(r),delTx:id=>db.doc("tx/"+id).delete(),
    set:(c,r)=>db.doc(c+"/"+r.id).set(r),del:(c,id)=>db.doc(c+"/"+id).delete()};
  const er=k=>e=>{console.error(e);ready[k]=true;render()};
  unsubs.push(db.collection("accounts").onSnapshot(s=>{accounts=s.docs.map(d=>({...d.data(),id:d.id}));ready.a=true;render()},er("a")));
  unsubs.push(db.collection("receipts").onSnapshot(s=>{receipts=s.docs.map(d=>({...d.data(),id:d.id,items:Array.isArray(d.data().items)?d.data().items:[]}));ready.p=true;render()},er("p")));
  unsubs.push(db.collection("subs").onSnapshot(s=>{subs=s.docs.map(d=>({...d.data(),id:d.id}));ready.s=true;render()},er("s")));
  unsubs.push(db.collection("transfers").onSnapshot(s=>{transfers=s.docs.map(d=>({...d.data(),id:d.id}));ready.r=true;render()},er("r")));
  unsubs.push(db.collection("months").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());months=o;ready.m=true;pickStart();render()},er("m")));
  unsubs.push(db.collection("tx").onSnapshot(s=>{txs=s.docs.map(d=>({...d.data(),id:d.id}));ready.t=true;render()},er("t")));
  unsubs.push(db.collection("catrules").onSnapshot(s=>{const o={};s.docs.forEach(d=>{const x=d.data();if(x.k&&x.sub)o[x.k]=x.sub});ruleMap=o;ready.c=true},er("c")));
}
function start(){
  render();
  const cfg=CONFIG.firebase||{};
  if(!cfg.apiKey||!cfg.projectId){showSetup();return}
  const go=()=>{const FB=window.__fb;if(!FB){showLogin("Firebase se nije učitao. Proveri internet vezu.");return}
    FB.onAuth(u=>{if(u)startData(FB,u);else{unsubs.forEach(x=>{try{x()}catch(e){}});unsubs=[];showLogin()}})};
  if(window.__fb)go();else{window.addEventListener("fb-ready",go,{once:true});setTimeout(()=>{if(!window.__fb)showLogin("Firebase se nije učitao. Proveri internet vezu.")},15000)}
}
/* ---------- settings: backup ---------- */
function settingsCard(){return `<section class="card"><h2 class="sec-title">Podešavanja</h2>
  <div class="kv"><span>Prijavljen kao</span><b>${esc(fbUser&&fbUser.email||"")}</b></div>
  <div class="row2" style="margin-top:10px"><button class="btn ghost" type="button" id="bkExport">Izvezi kopiju</button><button class="btn ghost" type="button" id="bkImport">Uvezi kopiju</button></div>
  <div class="err" id="bkErr"></div>
  <button class="btn ghost" type="button" id="logout" style="margin-top:4px">Odjavi se</button></section>`}
function bindSettings(){
  const ex=$("#bkExport");if(!ex)return;
  ex.onclick=()=>{const data={months:Object.entries(months).map(([id,v])=>({...v,id})),tx:txs,accounts,transfers,subs,receipts};
    const blob=new Blob([JSON.stringify({app:"budzetiranje",version:1,exported:todayISO(),data},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="budzet-kopija-"+todayISO()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)};
  $("#bkImport").onclick=()=>{const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    try{const j=JSON.parse(await f.text());const d=j.data||j;let n=0;
      const cols=["months","tx","accounts","transfers","subs","receipts"];
      for(const c of cols)for(const r of (d[c]||[])){if(!r||!r.id)continue;const {id,...rest}=r;
        if(c==="months")await store.setMonth(id,rest);else await store.set(c,{...rest,id});n++}
      toast(n+" zapisa uvezeno")}catch(e){$("#bkErr").textContent="Fajl nije ispravna rezervna kopija."}};inp.click()};
  $("#logout").onclick=()=>window.__fb.signOut();
}
start();

})();
</script>
