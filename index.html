<style>
/* Layout: single phone column, sticky month header, content tabs, fixed bottom tab bar + floating add button */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f5f7fb; --ink:#16203a; --muted:#66708a; --line:#dde2ec;
  --head:#1b2742; --head-ink:#ffffff; --head-muted:#aab5cf;
  --g1:#2f5fb3; --g2:#d27c12; --g3:#2a8753;
  --ok:#2a8753; --warn:#d27c12; --bad:#c9352b;
  --ok-bg:#e3f3ea; --warn-bg:#fcefdc; --bad-bg:#fbe5e3; --info-bg:#e5edfb; --soft-bg:#fff7e0; --soft:#a8790a;
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1120; --surface:#151c2f; --surface2:#1b2339; --ink:#e8ecf5; --muted:#94a0bb; --line:#263049;
  --head:#111a2e; --head-ink:#ffffff; --head-muted:#8f9bb8;
  --g1:#6d98ea; --g2:#f0a447; --g3:#4fbf82;
  --ok:#4fbf82; --warn:#f0a447; --bad:#f06b60;
  --ok-bg:#16322a; --warn-bg:#3a2a14; --bad-bg:#3d1c1c; --info-bg:#1a2745; --soft-bg:#332b12; --soft:#e8c35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1120; --surface:#151c2f; --surface2:#1b2339; --ink:#e8ecf5; --muted:#94a0bb; --line:#263049;
  --head:#111a2e; --head-ink:#ffffff; --head-muted:#8f9bb8;
  --g1:#6d98ea; --g2:#f0a447; --g3:#4fbf82;
  --ok:#4fbf82; --warn:#f0a447; --bad:#f06b60;
  --ok-bg:#16322a; --warn-bg:#3a2a14; --bad-bg:#3d1c1c; --info-bg:#1a2745; --soft-bg:#332b12; --soft:#e8c35a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
.app{max-width:540px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink);padding:14px 16px 12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mbtn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--head-ink);font-size:20px;line-height:1;display:grid;place-items:center}
.mlabel{text-align:center;min-width:0}
.mlabel .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--head-muted)}
.mlabel h1{margin:2px 0 0;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.01em}

main{padding:16px;display:flex;flex-direction:column;gap:16px}
.banner{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px}
.card{background:var(--surface);border-radius:18px;padding:16px;border:1px solid var(--line)}
.sec-title{font-family:var(--display);font-weight:600;font-size:17px;margin:0 0 10px;text-wrap:balance}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* hero */
.hero{background:var(--surface);border-radius:22px;padding:18px 18px 16px;border:1px solid var(--line)}
.hero .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.05;margin:4px 0 2px;letter-spacing:-.01em}
.hero .sub{color:var(--muted);font-size:13px}
.meter{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:14px 0 6px;display:flex}
.meter i{display:block;height:100%}
.meter-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:20px;margin-top:2px}
.kpi small{color:var(--muted);font-size:12px}

/* donut */
.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.donut{width:150px;height:150px}
.donut text{fill:var(--ink)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend span:last-child{color:var(--muted)}
@media (max-width:360px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}

/* categories */
.group{border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.ghead{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;border-left:5px solid var(--gc)}
.ghead h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gc)}
.ghead .num{font-size:13px;color:var(--muted)}
.crow{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.crow-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.crow-name{font-weight:600}
.crow-amt{font-size:13px;color:var(--muted);white-space:nowrap}
.crow-amt b{color:var(--ink)}
.bar{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.crow-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.none{color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right}
tr:last-child td{border-bottom:0}
.pos{color:var(--bad);font-weight:700}.neg{color:var(--ok);font-weight:700}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.kv:last-child{border-bottom:0}
.kv b{white-space:nowrap}
.kv.total{font-weight:700;font-size:15px}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}

/* transactions */
.tx-head{display:flex;justify-content:space-between;align-items:baseline}
.day{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 4px 6px}
.txlist{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.tx:first-child{border-top:0}
.tx .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--gc);flex:none}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-weight:600}
.tx .mid span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-weight:700;white-space:nowrap}
.copybox{display:flex;flex-direction:column}
.copyarea{margin-top:8px;width:100%;min-height:90px;font:12px/1.4 ui-monospace,monospace;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* plan form */
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:600;min-width:0}
.field label small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.money{display:flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:0 10px;width:132px;flex:none}
.money input{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;text-align:right;padding:9px 0;font-variant-numeric:tabular-nums}
.money input:focus{outline:none}
.money:focus-within{border-color:var(--g1)}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;width:100%}
.btn.primary{background:var(--head);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--g1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--g1)}}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}

/* tab bar + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center}
.mbtn.off{visibility:hidden}
.tab{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.fab{justify-self:center;width:56px;height:56px;border-radius:50%;border:0;background:var(--g1);color:#fff;font-size:30px;line-height:1;margin-top:-26px;box-shadow:0 6px 18px rgba(20,40,90,.3)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:540px;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--display);font-size:20px;margin:0 0 12px}
.amt-in{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:8px 0 14px}
.amt-in input{font-family:var(--display);font-weight:800;font-size:44px;width:100%;max-width:260px;text-align:right;border:0;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums}
.amt-in input:focus{outline:none}
.amt-in span{font-family:var(--display);font-weight:800;font-size:30px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:#fff}
.inrow{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.inrow input{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}
/* accounts */
.acc-list{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.acc{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.acc:first-child{border-top:0}
.acc .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;background:var(--gc);flex:none}
.acc .mid{flex:1;min-width:0}
.acc .mid b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .mid span{display:block;color:var(--muted);font-size:12.5px}
.acc .amt{font-weight:800;font-family:var(--display);font-size:17px;white-space:nowrap}
.acc.out .amt{color:var(--muted)}
.sub-h{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 8px}
.sub-h h3{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.switch b{display:block;font-weight:600}
.switch small{color:var(--muted);font-size:12px}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
.inrow select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.acc-sum{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.acc-sum span{font-size:12.5px;color:var(--muted)}
.acc-sum b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--g1);font-weight:700;padding:0;font-size:13px}
.subs{margin:4px 0 8px 12px;padding:10px 0 4px 12px;border-left:2px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.subs-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mini-sw{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;cursor:pointer}
.mini-sw input{width:16px;height:16px;accent-color:var(--g1)}
.sublist{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--sc,var(--line));background:var(--sb,var(--surface));text-align:left;transition:background .2s}
.srow .sday{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface2);color:var(--sc,var(--ink));flex:none}
.srow .mid{flex:1;min-width:0}
.srow .mid b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .mid span{display:block;font-size:12px;color:var(--sc,var(--muted));font-weight:600}
.srow .amt{font-weight:700;white-space:nowrap}
.srow.s-now{--sc:var(--bad);--sb:var(--bad-bg)}
.srow.s-3{--sc:var(--warn);--sb:var(--warn-bg)}
.srow.s-7{--sc:var(--soft);--sb:var(--soft-bg)}
.srow.s-14{--sc:var(--g1);--sb:var(--info-bg)}
.srow.s-far{--sc:var(--muted)}
.srow.s-done{--sc:var(--ok);opacity:.75}
.subs-sum{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.subs-sum b{color:var(--ink)}
.okmark{color:var(--ok);font-weight:700}
.subs-tg{background:none;border:0;padding:0;text-align:left;min-width:0;display:flex;flex-direction:column;gap:1px}
.subs-tg .tg-name{font-weight:600;display:flex;align-items:center;gap:6px}
.subs-tg .chev{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:15px;transition:transform .15s}
.subs-tg[aria-expanded="true"] .chev{transform:rotate(90deg)}
.subs-tg small{font-size:12px;color:var(--sc,var(--muted));font-weight:600}
.subs-tg.s-now{--sc:var(--bad)}.subs-tg.s-3{--sc:var(--warn)}.subs-tg.s-7{--sc:var(--soft)}.subs-tg.s-14{--sc:var(--g1)}
@media (prefers-reduced-motion: reduce){.subs-tg .chev{transition:none}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn.scan{background:var(--g1);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.scanning{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 8px 10px;text-align:center}
.scanning b{font-size:17px}.scanning span{color:var(--muted);font-size:13px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--g1);animation:sp 0.9s linear infinite;margin-bottom:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}

<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <button class="mbtn" id="prevM" aria-label="Prethodni mesec">‹</button>
      <div class="mlabel"><div class="eyebrow" id="viewName">Pregled</div><h1 id="monthTitle">—</h1></div>
      <button class="mbtn" id="nextM" aria-label="Sledeći mesec">›</button>
    </div>
  </header>
  <main id="main"><div class="loading">Učitavam budžet…</div></main>
</div>

<nav class="tabs" aria-label="Glavni meni">
  <div class="tabs-in">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/></svg>Pregled</button>
    <button class="tab" data-tab="transakcije">

    <button class="tab" data-tab="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Plan</button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M7 15h4"/></svg>Računi</button>
  </div>

<div id="layer"></div>

<script>
(function(){
const GMETA=[
 {id:"osnovni",name:"Osnovni troškovi",rule:"Potrebe",rec:.5,color:"--g1"},
 {id:"licno",name:"Lično",rule:"Želje",rec:.3,color:"--g2"},
 {id:"invest",name:"Investicije i štednja",rule:"Štednja",rec:.2,color:"--g3"}];
const DEFAULT_CATS=[
 {id:"osnovni",cats:[{id:"hipoteka",name:"Hipoteka"},{id:"racuni",name:"Računi",items:true},{id:"pretplate",name:"Online pretplate",items:true},{id:"hrana",name:"Hrana"}]},
 {id:"licno",cats:[{id:"cigare",name:"Cigare"},{id:"razno",name:"Razno"}]},
 {id:"invest",cats:[{id:"etf",name:"ETF"},{id:"zlato",name:"Investiciono zlato"}]}];
const TEMPLATE_CATS=[
 {id:"osnovni",cats:[{id:"stan",name:"Stanovanje"},{id:"racuni",name:"Računi",items:true},{id:"pretplate",name:"Online pretplate",items:true},{id:"hrana",name:"Hrana"},{id:"prevoz",name:"Prevoz"}]},
 {id:"licno",cats:[{id:"izlasci",name:"Izlasci i zabava"},{id:"odeca",name:"Odeća"},{id:"razno",name:"Razno"}]},
 {id:"invest",cats:[{id:"stednja",name:"Štednja"},{id:"investicije",name:"Investicije"}]}];
const DEFAULT_INC=[{id:"plata",name:"Plata"}];
let INC=DEFAULT_INC;
let GROUPS=[],CATS={},CATINFO={},CATDEF=DEFAULT_CATS;
function setCats(def){def=Array.isArray(def)&&def.length?def:DEFAULT_CATS;CATDEF=def;
  GROUPS=GMETA.map(m=>{const g=def.find(x=>x.id===m.id)||{cats:[]};return{...m,cats:(g.cats||[]).map(c=>[c.id,c.name])}});
  CATS={};CATINFO={};
  GROUPS.forEach(g=>{const src=(def.find(x=>x.id===g.id)||{cats:[]}).cats||[];
    g.cats.forEach(([id,name],i)=>{CATS[id]={id,name,group:g,shade:[1,.8,.62,.46,.34,.26][Math.min(i,5)]};CATINFO[id]=src[i]||{}})})}
setCats(null);
function catOptions(sel){return GROUPS.map(G=>`<optgroup label="${esc(G.name)}">${G.cats.map(([id,n])=>`<option value="${id}"${id===sel?" selected":""}>${esc(n)}</option>`).join("")}</optgroup>`).join("")}
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,"").slice(0,16)||"kat";
/* ---------- category editor ---------- */
let ed=null;
function openCatEditor(){
  ed={inc:INC.map(x=>({...x})),groups:GMETA.map(m=>{const g=CATDEF.find(x=>x.id===m.id)||{cats:[]};return{id:m.id,cats:(g.cats||[]).map(c=>({...c}))}}),deleted:[]};
  renderCatEditor();
}
function usage(id){return{tx:txs.filter(t=>t.cat===id).length,subs:subs.filter(s=>(s.cat||"pretplate")===id).length}}
function renderCatEditor(){
  const y=$("#layer .sheet")?$("#layer .sheet").scrollTop:0;
  const all=ed.groups.flatMap(g=>g.cats);
  let h=`<div class="scrim" id="scrim"><form class="sheet" id="ceForm" role="dialog" aria-label="Uredi kategorije i prihode"><div class="grab"></div><h2>Kategorije i prihodi</h2>
   <p class="note" style="margin:-6px 0 12px">Promene važe za ceo budžet i sve njegove članove.</p>
   <div class="ce-group" style="--gc:var(--ok)"><div class="ce-gh">Izvori prihoda</div>
   ${ed.inc.map((x,i)=>`<div class="ce-row ce-inc"><input class="ce-name" data-incn="${i}" maxlength="30" value="${esc(x.name)}" placeholder="npr. Plata, Honorar, Najam" aria-label="Naziv izvora prihoda"><button type="button" class="rv-x" data-incdel="${i}" aria-label="Obriši izvor prihoda"${ed.inc.length<2?" disabled":""}>×</button></div>`).join("")}
   <button type="button" class="linkbtn" id="incAdd" style="margin:6px 2px 4px">+ Dodaj izvor prihoda</button></div>
   <p class="note" style="margin:0 0 10px">Kategorije troškova (grupe odgovaraju pravilu 50/30/20):</p>`;
  ed.groups.forEach((g,gi)=>{const M=GMETA[gi];
    h+=`<div class="ce-group" style="--gc:var(${M.color})"><div class="ce-gh">${M.name}</div>`;
    if(!g.cats.length)h+=`<p class="note" style="margin:4px 0 8px">Nema kategorija u ovoj grupi.</p>`;
    g.cats.forEach((c,ci)=>{h+=`<div class="ce-row"><input class="ce-name" data-g="${gi}" data-c="${ci}" maxlength="30" value="${esc(c.name)}" aria-label="Naziv kategorije">
      <div class="ce-opts"><label class="mini-sw"><input type="checkbox" data-items="${gi}:${ci}" ${c.items?"checked":""}> Lista stavki</label>
      <select data-move="${gi}:${ci}" aria-label="Premesti u grupu">${GMETA.map((m,mi)=>`<option value="${mi}"${mi===gi?" selected":""}>${m.rule}</option>`).join("")}</select>
      <button type="button" class="rv-x" data-cdel="${gi}:${ci}" aria-label="Obriši kategoriju">×</button></div></div>`});
    h+=`<button type="button" class="linkbtn" data-cadd="${gi}" style="margin:6px 2px 4px">+ Dodaj kategoriju</button></div>`});
  const needMove=ed.deleted.filter(d=>d.use.tx||d.use.subs);
  if(needMove.length){h+=`<div class="ce-del"><div class="lbl" style="margin-bottom:6px">Obrisane kategorije sa troškovima</div>`;
    needMove.forEach((d,i)=>{h+=`<div class="inrow"><label class="lbl" for="mv_${i}">„${esc(d.name)}“ (${d.use.tx} troškova${d.use.subs?", "+d.use.subs+" stavki":""}) premesti u</label>
      <select id="mv_${i}" data-mvto="${esc(d.id)}">${all.map(c=>`<option value="${c.id}"${c.id===d.target?" selected":""}>${esc(c.name)}</option>`).join("")}</select></div>`});
    h+=`</div>`}
  h+=`<div class="err" id="ce_err"></div><div class="actions"><button class="btn primary" type="submit">Sačuvaj kategorije</button><button class="btn ghost" type="button" id="ce_cancel">Otkaži</button></div></form></div>`;
  $("#layer").innerHTML=h;if($("#layer .sheet"))$("#layer .sheet").scrollTop=y;
  $("#ce_cancel").onclick=()=>{ed=null;$("#layer").innerHTML=""};
  document.querySelectorAll("#ceForm [data-incn]").forEach(el=>el.oninput=()=>{ed.inc[+el.dataset.incn].name=el.value});
  document.querySelectorAll("#ceForm [data-incdel]").forEach(el=>el.onclick=()=>{if(ed.inc.length<2)return;ed.inc.splice(+el.dataset.incdel,1);renderCatEditor()});
  $("#incAdd").onclick=()=>{ed.inc.push({id:"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:"",_new:true});renderCatEditor();const ins=document.querySelectorAll("#ceForm [data-incn]");ins[ins.length-1].focus()};
  document.querySelectorAll("#ceForm .ce-name[data-g]").forEach(el=>el.oninput=()=>{ed.groups[+el.dataset.g].cats[+el.dataset.c].name=el.value});
  document.querySelectorAll("#ceForm [data-items]").forEach(el=>el.onchange=()=>{const[g,c]=el.dataset.items.split(":").map(Number);ed.groups[g].cats[c].items=el.checked});
  document.querySelectorAll("#ceForm [data-move]").forEach(el=>el.onchange=()=>{const[g,c]=el.dataset.move.split(":").map(Number);const to=+el.value;if(to===g)return;
    const [cat]=ed.groups[g].cats.splice(c,1);ed.groups[to].cats.push(cat);renderCatEditor()});
  document.querySelectorAll("#ceForm [data-cdel]").forEach(el=>el.onclick=()=>{const[g,c]=el.dataset.cdel.split(":").map(Number);
    const [cat]=ed.groups[g].cats.splice(c,1);const u=usage(cat.id);
    if(!cat._new){const rest=ed.groups.flatMap(x=>x.cats);ed.deleted.push({id:cat.id,name:cat.name,use:u,target:(rest[0]||{}).id})}renderCatEditor()});
  document.querySelectorAll("#ceForm [data-cadd]").forEach(el=>el.onclick=()=>{const g=+el.dataset.cadd;
    ed.groups[g].cats.push({id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:"",_new:true});renderCatEditor();
    const ins=document.querySelectorAll(`#ceForm .ce-name[data-g="${g}"]`);if(ins.length)ins[ins.length-1].focus()});
  document.querySelectorAll("#ceForm [data-mvto]").forEach(el=>el.onchange=()=>{const d=ed.deleted.find(x=>x.id===el.dataset.mvto);if(d)d.target=el.value});
  $("#ceForm").onsubmit=async e=>{e.preventDefault();
    const all2=ed.groups.flatMap(g=>g.cats);
    if(!all2.length){$("#ce_err").textContent="Budžet mora imati bar jednu kategoriju.";return}
    if(ed.inc.some(x=>!x.name.trim())){$("#ce_err").textContent="Svaki izvor prihoda mora imati naziv.";return}
    const incomeSources=ed.inc.map(x=>({id:x._new?slug(x.name)+"_"+x.id.slice(-4):x.id,name:x.name.trim().slice(0,30)}));
    if(all2.some(c=>!c.name.trim())){$("#ce_err").textContent="Svaka kategorija mora imati naziv.";return}
    const names=all2.map(c=>norm(c.name.trim()));if(new Set(names).size!==names.length){$("#ce_err").textContent="Dve kategorije imaju isti naziv.";return}
    const moves=ed.deleted.filter(d=>(d.use.tx||d.use.subs));
    if(moves.some(d=>!all2.find(c=>c.id===d.target))){$("#ce_err").textContent="Izaberi gde da se premeste troškovi obrisanih kategorija.";return}
    const cats=ed.groups.map(g=>({id:g.id,cats:g.cats.map(c=>{const o={id:c._new?slug(c.name)+"_"+c.id.slice(-4):c.id,name:c.name.trim().slice(0,30)};if(c.items)o.items=true;return o})}));
    const btn=$("#ceForm .btn.primary");btn.disabled=true;btn.textContent="Čuvam…";
    try{await store.setBudget({cats,incomeSources});
      for(const d of moves){for(const t of txs.filter(t=>t.cat===d.id))await store.setTx({...t,cat:d.target});
        for(const s of subs.filter(s=>(s.cat||"pretplate")===d.id))await store.set("subs",{...s,cat:d.target})}
      ed=null;$("#layer").innerHTML="";toast("Kategorije sačuvane")}
    catch(err){btn.disabled=false;btn.textContent="Sačuvaj kategorije";$("#ce_err").textContent=errMsg(err)}};
}

const MONTHS=["januar","februar","mart","april","maj","jun","jul","avgust","septembar","oktobar","novembar","decembar"];
const DAYS=["nedelja","ponedeljak","utorak","sreda","četvrtak","petak","subota"];
const nf=new Intl.NumberFormat("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});
const pf=new Intl.NumberFormat("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});
const eur=v=>nf.format(v||0)+" €";
const pct=v=>isFinite(v)?pf.format((v||0)*100)+"%":"–";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseNum=s=>{s=String(s||"").trim().replace(/\s|€/g,"");if(!s)return NaN;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return Number(s)};
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const mkey=d=>d.slice(0,7);
const shift=(k,n)=>{let[y,m]=k.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+String(m).padStart(2,"0")};
const mTitle=k=>{const[y,m]=k.split("-");return MONTHS[m-1].toUpperCase()+" "+y};

let months={},txs=[],accounts=[],transfers=[],subs=[],cur=mkey(todayISO()),tab="pregled",ready={m:false,t:false,a:false,r:false,s:false,p:false,b:false},store=null,localMode=false,readOnly=false,picked=false;
const ATYPES={
  kartica:{name:"Kartica",ic:"KA",inc:true,color:"--g1"},
  tekuci:{name:"Tekući račun",ic:"TR",inc:true,color:"--g1"},
  kes:{name:"Keš",ic:"€",inc:true,color:"--g2"},
  stednja:{name:"Štednja",ic:"ŠT",inc:false,color:"--g3"},
  invest:{name:"Investicije",ic:"IN",inc:false,color:"--g3"},
  ostalo:{name:"Ostalo",ic:"•",inc:true,color:"--muted"}};
const CAM='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function accBal(a){const since=a.setAt||0;let b=+a.opening||0;
  txs.forEach(t=>{if(t.account===a.id&&(t.created||0)>since)b-=+t.amount||0});
  transfers.forEach(r=>{if((r.created||0)<=since)return;if(r.from===a.id)b-=+r.amount||0;if(r.to===a.id)b+=+r.amount||0});
  return Math.round(b*100)/100}
function accSorted(){return accounts.slice().sort((a,b)=>(a.order||0)-(b.order||0)||(a.created||0)-(b.created||0))}
function accTotals(){let inB=0,outB=0;accounts.forEach(a=>{const b=accBal(a);if(a.include)inB+=b;else outB+=b});return{inB,outB,all:inB+outB}}
let lastAcc="";try{lastAcc=localStorage.getItem("budzet-lastacc")||""}catch(e){}

/* ---------- data access ---------- */
function incOf(m){if(m&&m.incomes&&typeof m.incomes==="object")return {...m.incomes};return m&&m.income?{[INC[0].id]:+m.income}:{}}
const incSum=o=>INC.reduce((s,x)=>s+(+o[x.id]||0),0);
function monthData(k){
  if(months[k])return {...months[k],incomes:incOf(months[k]),_exists:true};
  const keys=Object.keys(months).sort();
  const prev=keys.filter(x=>x<k).pop(), next=keys.find(x=>x>k), src=prev||next;
  const base=src?months[src]:{income:0,budgets:{}};
  return {incomes:incOf(base),budgets:{...(base.budgets||{})},carry:null,_exists:false};
}
function calc(k,depth=0){
  const m=monthData(k),inc=Math.round(incSum(m.incomes)*100)/100;
  const spent={};txs.forEach(t=>{if(t.month===k)spent[t.cat]=(spent[t.cat]||0)+(+t.amount||0)});
  const cats={};let plan=0,spentAll=0;
  Object.values(CATS).forEach(c=>{const b=+(m.budgets||{})[c.id]||0,s=spent[c.id]||0;cats[c.id]={b,s};plan+=b;spentAll+=s});
  Object.keys(spent).forEach(id=>{if(!CATS[id])spentAll+=spent[id]});
  const g={};GROUPS.forEach(G=>{g[G.id]={b:0,s:0};G.cats.forEach(([id])=>{g[G.id].b+=cats[id].b;g[G.id].s+=cats[id].s})});
  const kes=inc-Math.max(plan,spentAll);
  let carry=m.carry;

function subDue(day){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
  const thisC=Math.min(day,dim(y,m));
  if(thisC>=d)return{days:thisC-d,charged:false,date:new Date(y,m,thisC)};
  const ny=m===11?y+1:y,nm=(m+1)%12,nextC=Math.min(day,dim(ny,nm));
  return{days:dim(y,m)-d+nextC,charged:true,chargedDay:thisC,date:new Date(ny,nm,nextC)};
}

  if(/:/.test(txt||""))throw{code:"offline"};throw{code:"noqr"}}
function stopCam(){if(scanTimer){clearInterval(scanTimer);scanTimer=null}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
function decodeCanvas(cv){const ctx=cv.getContext("2d",{willReadFrequently:true});const d=ctx.getImageData(0,0,cv.width,cv.height);
  const r=window.jsQR?jsQR(d.data,cv.width,cv.height,{inversionAttempts:"attemptBoth"}):null;return r&&r.data}
function pickReceipt(){

  $("#qrPhoto").onclick=()=>{const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    try{const img=await createImageBitmap(f);const cv=$("#qrc");let txt=null;
      for(const w of [1600,1000,700]){const s=Math.min(1,w/img.width);cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);txt=decodeCanvas(cv);if(txt)break}
      loadById(extractId(txt))}catch(e){$("#scanErr").textContent=ekErr(e.code?e:{code:"noqr"})}};inp.click()};
  startCam();
}
async function startCam(){
  const v=$("#qrv"),msg=$("#qrmsg");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent="Kamera nije dostupna. Koristi „Iz fotografije“.";return}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){msg.textContent="Nema dozvole za kameru. Dozvoli je u podešavanjima pregledača ili koristi „Iz fotografije“.";return}
  if(!$("#qrv")){stopCam();return}
  v.srcObject=scanStream;await v.play().catch(()=>{});msg.textContent="Uperi kameru u QR kod na računu";
  const cv=$("#qrc");
  scanTimer=setInterval(()=>{if(!v.videoWidth)return;const s=Math.min(1,800/v.videoWidth);cv.width=Math.round(v.videoWidth*s);cv.height=Math.round(v.videoHeight*s);
    cv.getContext("2d",{willReadFrequently:true}).drawImage(v,0,0,cv.width,cv.height);const txt=decodeCanvas(cv);if(!txt)return;
    try{const id=extractId(txt);stopCam();loadById(id)}catch(e){$("#scanErr").textContent=ekErr(e)}},180);
}

async function saveReceipt(){
  const old=draft.id?receipts.find(r=>r.id===draft.id):null;
  const id=draft.id||newId("p"),now=Date.now(),split=draftSplit(),txIds=[];
  if(old)for(const tid of (old.txIds||[]))await store.del("tx",tid);
  const byCat={},first={};Object.entries(split).forEach(([b,amt])=>{const c=rmapFor(b);byCat[c]=Math.round(((byCat[c]||0)+amt)*100)/100;if(!(c in first))first[c]=b});
  const newMap={...(budgetDoc.receiptMap||{})};Object.keys(split).forEach(b=>newMap[b]=rmapFor(b));
  let n=0;for(const [cat,amt] of Object.entries(byCat)){if(amt<=0)continue;const tid=id+"_"+cat;txIds.push(tid);
    await store.setTx({id:tid,date:draft.date,month:mkey(draft.date),cat,desc:draft.store.trim()+(first[cat]==="hrana"?"":" · "+CATS[cat].name.toLowerCase()),amount:amt,created:(old&&old.created||now)+(n++),account:draft.account||"",receipt:id})}
  await store.set("receipts",{id,store:draft.store.trim()||"Prodavnica",date:draft.date,month:mkey(draft.date),total:draft.total,account:draft.account||"",
    items:draft.items.map(it=>({name:String(it.name).trim().slice(0,60)||"Stavka",raw:it.raw||"",qty:+it.qty||1,price:+it.price||0,sub:it.sub})),txIds,created:old&&old.created||now,ekasaId:draft.ekasaId||(old&&old.ekasaId)||""});
  const learned={};draft.items.forEach(it=>{const k=norm(it.raw||it.name).trim();if(!k)return;const auto=ruleMap[k]||it.auto;if(it.sub!==auto||(ruleMap[k]&&ruleMap[k]!==it.sub))learned[k]=it.sub});
  for(const [k,sub] of Object.entries(learned)){try{await store.set("catrules",{id:hashKey(k),k,sub});ruleMap[k]=sub}catch(e){}}
  if(JSON.stringify(newMap)!==JSON.stringify(budgetDoc.receiptMap||{})){try{await store.setBudget({receiptMap:newMap})}catch(e){}}
  if(draft.account){lastAcc=draft.account;try{localStorage.setItem("budzet-lastacc",lastAcc)}catch(e){}}
  if(mkey(draft.date)!==cur){cur=mkey(draft.date);picked=true;render()}
}

async function createOwnBudget(FB,user,inviteCode,migrating){
  const bid=newId("b");const data={name:"Moj budžet",owner:user.uid,members:[user.uid],memberEmails:{[user.uid]:user.email||""},cats:migrating?DEFAULT_CATS:TEMPLATE_CATS,incomeSources:DEFAULT_INC,created:Date.now(),migrating:!!migrating};
  if(inviteCode){data.invite=inviteCode;const bt=FB.writeBatch(FB.db);bt.set(FB.doc(FB.db,"budgets/"+bid),data);bt.update(FB.doc(FB.db,"invites/"+inviteCode),{usedBy:user.uid,usedAt:Date.now()});await bt.commit()}
  else await FB.setDoc(FB.doc(FB.db,"budgets/"+bid),data);
  return bid}
async function redeem(FB,user,code){
  const iv=await checkInvite(FB,code);
  if(iv.type==="new")return createOwnBudget(FB,user,code,false);
  const bt=FB.writeBatch(FB.db);
  bt.update(FB.doc(FB.db,"budgets/"+iv.budgetId),{members:FB.arrayUnion(user.uid),["memberEmails."+user.uid]:user.email||"",joinInvite:code});
  bt.update(FB.doc(FB.db,"invites/"+code),{usedBy:user.uid,usedAt:Date.now()});
  await bt.commit();return iv.budgetId}
async function hasLegacy(FB,uid){for(const c of ["months","accounts","subs","tx"]){try{const s=await FB.getDocs(FB.query(FB.collection(FB.db,"users/"+uid+"/"+c),FB.limit(1)));if(!s.empty)return true}catch(e){}}return false}
async function migrateLegacy(FB,uid,bid){
  let bt=FB.writeBatch(FB.db),n=0;
  for(const c of LEGACY){let s;try{s=await FB.getDocs(FB.collection(FB.db,"users/"+uid+"/"+c))}catch(e){continue}
    for(const d of s.docs){bt.set(FB.doc(FB.db,"budgets/"+bid+"/"+c+"/"+d.id),d.data());if(++n%400===0){await bt.commit();bt=FB.writeBatch(FB.db)}}}
  await bt.commit();await FB.updateDoc(FB.doc(FB.db,"budgets/"+bid),{migrating:false});return n}
async function afterLogin(FB,user){
  fbUser=user;stopSubs();lastShownInvite=null;myInvites=[];myBudgets=[];showBusy("Učitavam budžet…");
  const uref=FB.doc(FB.db,"users/"+user.uid);let bid=null;
  try{const s=await FB.getDoc(uref);bid=s.exists()?s.data().budgetId:null}catch(e){}
  if(bid){try{const b=await FB.getDoc(FB.doc(FB.db,"budgets/"+bid));if(!b.exists())bid=null}catch(e){bid=null}}
  if(!bid){try{const q=await FB.getDocs(FB.query(FB.collection(FB.db,"budgets"),FB.where("members","array-contains",user.uid)));if(!q.empty)bid=q.docs[0].id}catch(e){}}
  if(pendingInvite){const code=pendingInvite;pendingInvite=null;
    try{bid=await redeem(FB,user,code)}catch(e){if(!bid){fbUser=user;showNoBudget(inviteErr(e));return}}}
  if(!bid){const legacy=await hasLegacy(FB,user.uid);
    if(legacy||isAdminEmail(user.email)){
      try{showBusy(legacy?"Prebacujem tvoje podatke u novi oblik…":"Pravim tvoj budžet…");bid=await createOwnBudget(FB,user,null,legacy);
        if(legacy)await migrateLegacy(FB,user.uid,bid)}
      catch(e){console.error(e);screen("Greška",`<section class="card"><h2 class="sec-title">Budžet nije napravljen</h2><p>Proveri da su nova Firestore pravila objavljena i da je u njima upisan tvoj e-mail kao administrator (${esc(user.email||"")}).</p><p class="note">Greška: ${esc(e.code||e.message||"")}</p><button class="btn ghost" type="button" onclick="window.__fb.signOut()">Odjavi se</button></section>`);return}}}
  if(!bid){showNoBudget();return}
  await openBudget(FB,bid);
}
async function openBudget(FB,bid){
  const user=fbUser;stopSubs();
  await FB.setDoc(FB.doc(FB.db,"users/"+user.uid),{budgetId:bid,email:user.email||""},{merge:true}).catch(()=>{});
  try{const b=await FB.getDoc(FB.doc(FB.db,"budgets/"+bid));const d=b.exists()?b.data():{};
    if(d.migrating&&d.owner===user.uid){showBusy("Završavam prenos podataka…");await migrateLegacy(FB,user.uid,bid)}}catch(e){}
  BID=bid;document.body.classList.remove("nologin");
  months={};txs=[];accounts=[];transfers=[];subs=[];receipts=[];ruleMap={};
  Object.keys(ready).forEach(k=>ready[k]=false);picked=false;tab="pregled";txView="troskovi";window.scrollTo(0,0);render();
  const base="budgets/"+bid+"/";const clean=d=>JSON.parse(JSON.stringify(d));
  const col=(c,fn,k)=>unsubs.push(FB.onSnapshot(FB.collection(FB.db,base+c),s=>fn(s.docs.map(d=>({...d.data(),id:d.id}))),e=>{console.error(c,e);ready[k]=true;render()}));
  store={setMonth:(k,d)=>FB.setDoc(FB.doc(FB.db,base+"months/"+k),clean(d)),setTx:r=>FB.setDoc(FB.doc(FB.db,base+"tx/"+r.id),clean(r)),delTx:id=>FB.deleteDoc(FB.doc(FB.db,base+"tx/"+id)),
    set:(c,r)=>FB.setDoc(FB.doc(FB.db,base+c+"/"+r.id),clean(r)),del:(c,id)=>FB.deleteDoc(FB.doc(FB.db,base+c+"/"+id)),
    setBudget:f=>FB.updateDoc(FB.doc(FB.db,"budgets/"+bid),clean(f))};
  unsubs.push(FB.onSnapshot(FB.doc(FB.db,"budgets/"+bid),s=>{if(!s.exists()||!(s.data().members||[]).includes(user.uid)){afterLogin(FB,user);return}
    budgetDoc=s.data();INC=Array.isArray(budgetDoc.incomeSources)&&budgetDoc.incomeSources.length?budgetDoc.incomeSources:DEFAULT_INC;setCats(budgetDoc.cats);ready.b=true;render()},e=>{console.error(e);afterLogin(FB,user)}));
  col("accounts",a=>{accounts=a;ready.a=true;render()},"a");
  col("receipts",a=>{receipts=a.map(r=>({...r,items:Array.isArray(r.items)?r.items:[]}));ready.p=true;render()},"p");
  col("subs",a=>{subs=a;ready.s=true;render()},"s");
  col("transfers",a=>{transfers=a;ready.r=true;render()},"r");
  col("months",a=>{const o={};a.forEach(d=>{const{id,...rest}=d;o[id]=rest});months=o;ready.m=true;pickStart();render()},"m");
  col("tx",a=>{txs=a;ready.t=true;render()},"t");
  col("catrules",a=>{const o={};a.forEach(x=>{if(x.k&&x.sub)o[x.k]=x.sub});ruleMap=o},"c");
  unsubs.push(FB.onSnapshot(FB.query(FB.collection(FB.db,"budgets"),FB.where("members","array-contains",user.uid)),s=>{myBudgets=s.docs.map(d=>({id:d.id,name:d.data().name||"Budžet",owner:d.data().owner}));if(tab==="plan")render()},()=>{}));
  unsubs.push(FB.onSnapshot(FB.query(FB.collection(FB.db,"invites"),FB.where("createdBy","==",user.uid)),s=>{myInvites=s.docs.map(d=>({...d.data(),id:d.id}));if(tab==="plan")render()},()=>{}));
}

  document.querySelectorAll("[data-icopy]").forEach(b=>b.onclick=()=>{const code=b.dataset.icopy;const txt="Pozivam te u aplikaciju Budžetiranje. Otvori link, izaberi Registracija i napravi nalog:\n"+inviteLink(code)+"\nKod: "+fmtCode(code);
    try{navigator.clipboard.writeText(txt).then(()=>toast("Poruka kopirana"),()=>toast("Kopiraj kod ručno"))}catch(e){toast("Kopiraj kod ručno")}});
  document.querySelectorAll("[data-rmem]").forEach(b=>{let armed=false;b.onclick=async()=>{if(!armed){armed=true;b.textContent="Potvrdi uklanjanje";return}
    const uid=b.dataset.rmem;try{await FB.updateDoc(FB.doc(FB.db,"budgets/"+BID),{members:FB.arrayRemove(uid),["memberEmails."+uid]:FB.deleteField()});toast("Član uklonjen")}catch(e){$("#bdErr").textContent=errMsg(e)}}});
  if($("#bdLeave")){let armed=false;$("#bdLeave").onclick=async()=>{if(!armed){armed=true;$("#bdLeave").textContent="Dodirni ponovo: napuštaš budžet";return}
    try{await FB.updateDoc(FB.doc(FB.db,"budgets/"+BID),{members:FB.arrayRemove(me),["memberEmails."+me]:FB.deleteField()});await FB.setDoc(FB.doc(FB.db,"users/"+me),{budgetId:""},{merge:true});afterLogin(FB,fbUser)}catch(e){$("#bdErr").textContent=errMsg(e)}}}
  if($("#bd_switch"))$("#bd_switch").onchange=e=>{const v=e.target.value;if(v!==BID)openBudget(FB,v)};
  $("#bd_join").onclick=async()=>{const code=cleanCode($("#bd_code").value);if(!code)return;try{const bid=await redeem(FB,fbUser,code);toast("Pridružio si se budžetu");await openBudget(FB,bid)}catch(e){$("#bdErr").textContent=inviteErr(e)}};
  $("#bkExport").onclick=()=>{const data={months:Object.entries(months).map(([id,v])=>({...v,id})),tx:txs,accounts,transfers,subs,receipts,cats:CATDEF};
    const blob=new Blob([JSON.stringify({app:"budzetiranje",version:2,exported:todayISO(),data},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="budzet-kopija-"+todayISO()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)};
  $("#bkImport").onclick=()=>{const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    try{const j=JSON.parse(await f.text());const d=j.data||j;let n=0;
      if(Array.isArray(d.cats)&&d.cats.length)await store.setBudget({cats:d.cats});
      for(const c of ["months","tx","accounts","transfers","subs","receipts"])for(const r of (d[c]||[])){if(!r||!r.id)continue;const {id,...rest}=r;
        if(c==="months")await store.setMonth(id,rest);else await store.set(c,{...rest,id});n++}
      toast(n+" zapisa uvezeno")}catch(e){$("#bkErr").textContent="Fajl nije ispravna rezervna kopija."}};inp.click()};
  $("#logout").onclick=()=>FB.signOut();
}
/* ---------- bez zumiranja + automatsko ažuriranje ---------- */
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
let lastUpd=0;
async function checkUpdate(){
  if(Date.now()-lastUpd<60000)return;lastUpd=Date.now();
  try{const u=new URL("index.html",location.href);u.searchParams.set("t",Date.now());
    const txt=await (await fetch(u.href,{cache:"no-store"})).text();const m=txt.match(/APP_VERSION="([^"]+)"/);
    if(!m||m[1]===APP_VERSION)return;
    const go=()=>{const n=new URL("./",location.href);n.searchParams.set("v",m[1]);location.replace(n.href)};
    if(!$("#layer").innerHTML.trim())go();
    else if(!document.querySelector(".upd")){const b=document.createElement("button");b.className="upd";b.type="button";b.textContent="Nova verzija je spremna · Osveži";b.onclick=go;document.body.appendChild(b)}
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
setTimeout(checkUpdate,4000);setInterval(checkUpdate,30*60000);
start();

})();
</script>
